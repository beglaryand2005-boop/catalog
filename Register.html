                        <form class=" flex flex-col gap-20" action="#" method="get">

                                </label>

                            </div>
                            <div class="main-form">
                                <label for="Email-register">
                                    Email
                                    <span class="required">*</span>
                                </label>
                                <input type="email" name="email" id="Email-register" placeholder="Enter your email">
                            </div>
                            <div class="main-form">
                                <label for="Password-register">
                                    Password
                                    <span class="required">*</span>
                                </label>
                                <input type="password" name="user_pasword" id="Password-register"
                                    placeholder="Password">
                                <label for="">
                                    <input class="mr-5" type="checkbox" name="Show-me-password" value="See password">
                                    See password
                                </label>
                            </div>
                            <button class="bg-secondary w-100 btn">
                                Register
                            </button>
                            <p class=" flex justify-center">
